[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "med-data-cleaner"
version = "0.1.0"
description = "Local-first review and de-identification of pasted medical text"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "presidio-analyzer>=2.2,<3",
  "pydantic>=2.10,<3",
  "spacy>=3.8,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
desktop = [
  "pyinstaller>=6.11,<7",
  "pywebview>=5.3,<7",
]

[project.scripts]
med-data-cleaner = "med_data_cleaner.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
med_data_cleaner = [
  "deid/policies/*.json",
  "web/static/*.css",
  "web/static/*.html",
  "web/static/*.js",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
